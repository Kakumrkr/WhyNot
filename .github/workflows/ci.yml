# Fast PR gate (D-071). One run per PR update; superseded runs are cancelled.
# Property tests use the default 500 runs. The 5000-run properties and the
# wall-clock benchmark live in deep.yml, run manually at milestone gates.
name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --filter @whynot/web exec playwright install --with-deps chromium
      - run: pnpm --filter @whynot/web test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-browser-evidence
          path: |
            .tools/playwright/**/*.png
            .tools/playwright/**/*.zip
          include-hidden-files: true
          if-no-files-found: ignore
