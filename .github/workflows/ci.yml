# Fast PR gate (D-071). One run per PR update; superseded runs are cancelled.
# Property tests use the default 500 runs. The 5000-run properties and the
# wall-clock benchmark live in deep.yml, run manually at milestone gates.
name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --filter @whynot/web exec playwright install --with-deps chromium
      - run: pnpm --filter @whynot/web test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-browser-evidence
          path: |
            .tools/playwright/**/*.png
            .tools/playwright/**/*.zip
          include-hidden-files: true
          if-no-files-found: ignore
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_DB: whynot_test
          POSTGRES_USER: whynot
          POSTGRES_PASSWORD: whynot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whynot -d whynot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WHYNOT_TEST_DATABASE_URL: postgresql://whynot:whynot@127.0.0.1:5432/whynot_test
      DATABASE_URL: postgresql://whynot:whynot@127.0.0.1:5432/whynot_test?options=-c%20statement_timeout%3D5000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db:pg
      - run: pnpm --filter @whynot/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-local-browser-evidence
          path: |
            .tools/playwright-full/**/*.png
            .tools/playwright-full/**/*.zip
          include-hidden-files: true
          if-no-files-found: ignore
