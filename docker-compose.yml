services:
  db:
    image: postgres:16.16
    environment:
      POSTGRES_DB: whynot
      POSTGRES_USER: whynot
      POSTGRES_PASSWORD: whynot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - demo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whynot -d whynot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  demo-db:
